<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D Room Planner — MDF-рейки</title>
<style>
  :root{
    --bg:#0a0c0f;
    --panel:rgba(18,21,26,.84);
    --line:rgba(255,255,255,.09);
    --line2:rgba(255,255,255,.05);
    --txt:#e9ecf1;
    --dim:#8d95a3;
    --dim2:#69707c;
    --acc:#7fb2ff;
    --accSoft:rgba(127,178,255,.14);
    --warn:#ffb86b;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--txt);overflow:hidden;
    font:13px/1.45 "Segoe UI",Roboto,Helvetica,Arial,system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  #view{position:fixed;inset:0;display:block;width:100%;height:100%}
  #vignette{
    position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(125% 95% at 52% 44%,rgba(0,0,0,0) 52%,rgba(0,0,0,.45) 100%);
  }

  /* ================= боковая панель ================= */
  #panel{
    position:fixed;left:22px;top:22px;z-index:10;
    width:clamp(312px,21vw,372px);max-height:calc(100vh - 44px);
    display:flex;flex-direction:column;
    background:var(--panel);
    backdrop-filter:blur(20px) saturate(1.25);
    -webkit-backdrop-filter:blur(20px) saturate(1.25);
    border:1px solid var(--line);border-radius:16px;
    box-shadow:0 28px 70px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.05);
    overflow:hidden;transition:transform .28s ease,opacity .28s ease;
  }
  #panel.collapsed{transform:translateX(calc(-100% + 62px))}
  #panel.collapsed .pbody{opacity:0;pointer-events:none}
  #panel header{
    display:flex;align-items:center;gap:11px;
    padding:14px 14px 12px;border-bottom:1px solid var(--line2);flex:none;
  }
  .brand{display:flex;align-items:center;gap:11px;flex:1;min-width:0}
  .logo{
    width:30px;height:30px;border-radius:9px;flex:none;display:grid;place-items:center;
    background:linear-gradient(145deg,#4a6fa8,#22304a);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);
  }
  .logo div{display:flex;gap:2px;align-items:flex-end;height:14px}
  .logo s{width:2.5px;background:#cfe0ff;border-radius:1px;text-decoration:none}
  .logo s:nth-child(1){height:9px}.logo s:nth-child(2){height:14px}.logo s:nth-child(3){height:7px}
  .ttl{font-size:14px;font-weight:650;letter-spacing:.2px;white-space:nowrap}
  .sub{font-size:11px;color:var(--dim2);margin-top:1px;white-space:nowrap}
  .iconbtn{
    width:28px;height:28px;flex:none;border-radius:8px;cursor:pointer;
    background:rgba(255,255,255,.05);border:1px solid var(--line);
    color:var(--dim);font-size:16px;line-height:1;display:grid;place-items:center;
  }
  .iconbtn:hover{background:rgba(255,255,255,.1);color:#fff}

  .pbody{overflow-y:auto;overscroll-behavior:contain;padding-bottom:4px}
  .pbody::-webkit-scrollbar{width:8px}
  .pbody::-webkit-scrollbar-thumb{background:rgba(255,255,255,.13);border-radius:8px}

  .sec{padding:13px 16px 15px;border-bottom:1px solid var(--line2)}
  .sec:last-of-type{border-bottom:0}
  h3{
    margin:0 0 10px;font-size:10.5px;font-weight:700;letter-spacing:1.05px;
    text-transform:uppercase;color:var(--dim2);
  }

  /* ---------- мастер-переключатель ---------- */
  .master{
    display:flex;gap:12px;align-items:center;margin:13px 16px 4px;padding:12px 13px;
    border-radius:12px;cursor:pointer;
    background:linear-gradient(135deg,rgba(127,178,255,.16),rgba(127,178,255,.04));
    border:1px solid rgba(127,178,255,.25);
  }
  .master:hover{border-color:rgba(127,178,255,.45)}
  .mtitle{display:block;font-size:12.5px;font-weight:650;color:#dce8ff}
  .mhint{display:block;font-size:10.5px;color:#8fa5c6;margin-top:2px;transition:color .2s}
  .master.on .mhint{color:#a9c4ea}
  .switch{position:relative;flex:none;width:38px;height:22px}
  .switch input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
  .track{
    position:absolute;inset:0;border-radius:22px;background:rgba(255,255,255,.12);
    border:1px solid rgba(255,255,255,.12);transition:.2s;
  }
  .thumb{
    position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;
    background:#c8d3e4;transition:.22s cubic-bezier(.4,.1,.2,1);
    box-shadow:0 1px 3px rgba(0,0,0,.5);
  }
  .switch input:checked + .track{background:linear-gradient(135deg,#5b8ff9,#7fb2ff);border-color:transparent}
  .switch input:checked + .track .thumb{left:18px;background:#fff}

  /* ---------- select ---------- */
  .selwrap{position:relative}
  .selwrap:after{
    content:"";position:absolute;right:12px;top:50%;width:7px;height:7px;pointer-events:none;
    border-right:1.5px solid var(--dim);border-bottom:1.5px solid var(--dim);
    transform:translateY(-70%) rotate(45deg);
  }
  select{
    width:100%;appearance:none;-webkit-appearance:none;cursor:pointer;
    background:rgba(255,255,255,.05);color:var(--txt);
    border:1px solid var(--line);border-radius:10px;
    padding:9px 30px 9px 11px;font:inherit;font-size:12.5px;
  }
  select:hover{background:rgba(255,255,255,.08)}
  select:focus{outline:none;border-color:rgba(127,178,255,.55)}
  option{background:#151a21;color:#e9ecf1}
  .decorinfo{display:flex;align-items:center;gap:7px;margin-top:8px;font-size:10.5px;color:var(--dim2)}
  .swatch{width:11px;height:11px;border-radius:3px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.2)}
  .secnote{margin-top:8px;font-size:10.5px;color:var(--dim2);line-height:1.45}

  /* ---------- карточки-радио ---------- */
  .cards{display:grid;gap:7px}
  .card{
    position:relative;
    display:flex;gap:9px;align-items:flex-start;padding:9px 11px;cursor:pointer;
    border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.032);
    transition:background .15s,border-color .15s;
  }
  .card:hover{background:rgba(255,255,255,.06)}
  .card input{position:absolute;opacity:0;pointer-events:none}
  .dot{
    width:14px;height:14px;border-radius:50%;flex:none;margin-top:1px;
    border:1.5px solid rgba(255,255,255,.28);position:relative;transition:.15s;
  }
  .card input:checked ~ .dot{border-color:var(--acc)}
  .card input:checked ~ .dot:after{
    content:"";position:absolute;inset:2.6px;border-radius:50%;background:var(--acc);
  }
  .ctxt{min-width:0}
  .cname{font-size:12.5px;font-weight:600;line-height:1.25}
  .cdesc{font-size:10.5px;color:var(--dim2);line-height:1.35;margin-top:2px}
  .card:has(input:checked){background:var(--accSoft);border-color:rgba(127,178,255,.42)}
  .card:has(input:disabled){opacity:.38;cursor:not-allowed}

  /* ---------- чекбоксы ---------- */
  .chk{
    position:relative;
    display:flex;gap:9px;align-items:center;padding:7px 2px;cursor:pointer;user-select:none;
  }
  .chk input{position:absolute;opacity:0;pointer-events:none}
  .box{
    width:15px;height:15px;border-radius:4px;flex:none;
    border:1.5px solid rgba(255,255,255,.26);position:relative;transition:.15s;
    background:rgba(255,255,255,.03);
  }
  .chk input:checked + .box{background:var(--acc);border-color:var(--acc)}
  .chk input:checked + .box:after{
    content:"";position:absolute;left:3.5px;top:1px;width:4px;height:8px;
    border-right:2px solid #0d1117;border-bottom:2px solid #0d1117;
    transform:rotate(42deg);
  }
  .chk span.lbl{font-size:12px;color:#cfd6e1}
  .chk small{display:block;font-size:10px;color:var(--dim2);margin-top:1px}
  .chk input:disabled ~ span.lbl{color:var(--dim2)}
  .chk:has(input:disabled){opacity:.42;cursor:not-allowed}

  /* ---------- пилюли-радио ---------- */
  .pills{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .pill{
    position:relative;display:flex;align-items:center;justify-content:center;gap:6px;
    padding:7px 8px;border-radius:9px;cursor:pointer;text-align:center;
    font-size:11.5px;color:#c3cbd8;
    border:1px solid var(--line);background:rgba(255,255,255,.032);
    transition:.15s;
  }
  .pill:hover{background:rgba(255,255,255,.06)}
  .pill input{position:absolute;opacity:0;pointer-events:none}
  .pill:has(input:checked){background:var(--accSoft);border-color:rgba(127,178,255,.45);color:#eaf1ff;font-weight:600}
  .pill i{width:8px;height:8px;border-radius:50%;flex:none;box-shadow:0 0 0 1px rgba(255,255,255,.25)}

  /* ---------- низ ---------- */
  .foot{padding:12px 16px 14px;display:flex;flex-direction:column;gap:9px}
  .hint{font-size:10.5px;color:var(--dim2);line-height:1.5}
  .ghost{
    align-self:flex-start;cursor:pointer;font:inherit;font-size:11.5px;color:var(--dim);
    background:rgba(255,255,255,.04);border:1px solid var(--line);
    border-radius:8px;padding:6px 11px;
  }
  .ghost:hover{color:#fff;background:rgba(255,255,255,.09)}

  /* ================= оверлеи ================= */
  #overlay{
    position:fixed;inset:0;z-index:50;display:grid;place-items:center;
    background:radial-gradient(circle at 50% 45%,#161b23,#090b0e 70%);
    transition:opacity .45s ease;font-size:13px;
  }
  #overlay.hide{opacity:0;pointer-events:none}
  .ocard{text-align:center;max-width:520px;padding:0 28px}
  .spinner{
    width:34px;height:34px;margin:0 auto 18px;border-radius:50%;
    border:2.5px solid rgba(255,255,255,.12);border-top-color:var(--acc);
    animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  .ocard h2{margin:0 0 8px;font-size:15px;font-weight:600;letter-spacing:.2px}
  .ocard p{margin:0;color:var(--dim);font-size:12px;line-height:1.6}
  .ocard code{background:rgba(255,255,255,.07);padding:1px 5px;border-radius:4px;font-size:11px}
  .err{color:#ff9a9a}
  .badge-err{
    display:inline-block;margin-bottom:14px;padding:4px 10px;border-radius:20px;
    background:rgba(255,80,80,.12);border:1px solid rgba(255,80,80,.3);color:#ff9a9a;
    font-size:10.5px;letter-spacing:.6px;text-transform:uppercase;
  }
  @media (max-width:1100px){
    #panel{width:300px;left:12px;top:12px;max-height:calc(100vh - 24px)}
  }
  @media (max-width:760px){
    #panel{width:calc(100% - 24px);max-height:56vh;left:12px;top:auto;bottom:12px}
  }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="vignette"></div>
